<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQMRG | Local Sensor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.3);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .brand-text p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 2px 0 0 0;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Metrics Grid */
        .metrics-section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .last-updated {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .metric-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .metric-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
        }

        .metric-value-wrapper {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .metric-unit {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .metric-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .metric-trend {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 100px;
            font-weight: 500;
        }

        /* Data Table Section */
        .table-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .table-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .table-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 100px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--danger);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .details-cell {
            min-width: 100px;
        }

        .details-cell summary {
            cursor: pointer;
            color: var(--accent-cyan);
            white-space: nowrap;
        }

        .column-unit {
            display: block;
            margin-top: 4px;
            font-weight: normal;
            text-transform: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .cell-device {
            font-family: 'SF Mono', monospace;
            font-size: 0.8125rem;
            color: var(--accent-cyan);
        }

        .cell-value {
            font-weight: 600;
        }

        .cell-unit {
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 2px;
        }

        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .metric-value {
                font-size: 2rem;
            }

            .table-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }

        /* Loading animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">AQ</div>
                <div class="brand-text">
                    <h1>Air Quality Monitor</h1>
                    <p>Real-time sensor data dashboard</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <select id="device-selector" style="background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 0.875rem; outline: none; cursor: pointer; backdrop-filter: blur(10px);">
                    <option value="">All Sensors</option>
                </select>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>System Online</span>
                </div>
            </div>
        </header>

        <section class="table-section">
            <div class="table-header">
                <div class="table-title-wrapper">
                    <h2 class="table-title">Active Node Readings</h2>
                    <span class="last-updated" id="last-updated">Last updated: --</span>
                    <span class="live-badge">
                        <span class="live-dot"></span>
                        Live
                    </span>
                </div>
                <div style="display: flex; gap: 12px;">
                    <a href="/api/v1/health/export/csv" id="export-health-btn" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export Health Logs
                    </a>
                    <a href="/api/v1/data/export/csv" id="export-data-btn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export Sensor Data
                    </a>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Device ID</th>
                            <th>PM2.5</th>
                            <th>CO₂</th>
                            <th>Temperature</th>
                            <th>Humidity</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="readings-body">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                                    </svg>
                                    <p>Waiting for sensor data...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let currentDevice = ''; // Empty string implies fetching data from all devices

        // Configuration and Utility for dynamic metrics
        const METRIC_CONFIG = {
            pm1: { label: 'PM1.0', unit: 'µg/m³', icon: '💨' },
            pm25: { label: 'PM2.5 Concentration', unit: 'µg/m³', icon: '😷' },
            pm10: { label: 'PM10', unit: 'µg/m³', icon: '💨' },
            co: { label: 'Carbon Monoxide', unit: 'ppm', icon: '🔥' },
            co2: { label: 'Carbon Dioxide (CO₂)', unit: 'ppm', icon: '🌱' },
            temperature: { label: 'Temperature', unit: '°C', icon: '🌡️' },
            humidity: { label: 'Humidity', unit: '%', icon: '💧' },
            voc_index: { label: 'VOC Index', unit: 'idx', icon: '🧪' },
            nox_index: { label: 'NOx Index', unit: 'idx', icon: '🚗' },
        };

        const formatLabel = (key) => {
            if (METRIC_CONFIG[key]) return METRIC_CONFIG[key].label;
            return key.replace(/^s_/, '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        };

        const getUnit = (key) => METRIC_CONFIG[key]?.unit || '';
        const getIcon = (key) => METRIC_CONFIG[key]?.icon || '📊';

        async function loadDevices() {
            try {
                const res = await fetch('/api/v1/devices');
                const data = await res.json();
                const selector = document.getElementById('device-selector');
                selector.replaceChildren(new Option('All Sensors', ''));

                if (data.devices && data.devices.length > 0) {
                    data.devices.forEach(dev => {
                        const opt = document.createElement('option');
                        opt.value = dev;
                        opt.textContent = `Device: ${dev}`;
                        selector.appendChild(opt);
                    });
                }

                if (currentDevice && !data.devices?.includes(currentDevice)) {
                    currentDevice = '';
                    updateExportLinks();
                    fetchLatestData();
                }
                selector.value = currentDevice;
                selector.onchange = (e) => {
                    currentDevice = e.target.value;
                    updateExportLinks();
                    fetchLatestData();
                };
            } catch (err) {
                console.error('Error loading devices:', err);
            }
        }

        function updateExportLinks() {
            const dataBtn = document.getElementById('export-data-btn');
            const healthBtn = document.getElementById('export-health-btn');
            const suffix = currentDevice ? `?device_id=${currentDevice}` : '';
            if (dataBtn) dataBtn.href = '/api/v1/data/export/csv' + suffix;
            if (healthBtn) healthBtn.href = '/api/v1/health/export/csv' + suffix;
        }

        async function fetchLatestData() {
            try {
                const url = '/api/v1/data/latest?per_node=true' + (currentDevice ? `&device_id=${encodeURIComponent(currentDevice)}` : '');
                const response = await fetch(url);
                const data = await response.json();

                updateDashboard(data);
                if (!data.length) {
                    document.getElementById('readings-body').innerHTML = `<tr><td colspan="10"><div class="empty-state"><p>No active nodes reporting in the activity window.</p></div></td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateDashboard(readings) {
            const tableBody = document.getElementById('readings-body');
            const escapeHtml = value => String(value ?? '--').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
            const coreKeys = ['pm25', 'pm10', 'co2', 'temperature', 'humidity'];
            const columnLabels = {pm25: 'PM2.5', pm10: 'PM10', co2: 'CO₂', temperature: 'Temp.', humidity: 'Humidity'};
            const expandedNodes = new Set(Array.from(tableBody.querySelectorAll('details[open]')).map(el => el.dataset.node));
            document.getElementById('last-updated').textContent = 'Refreshed: ' + new Date().toLocaleTimeString();
            document.querySelector('thead tr').innerHTML = `
                <th>Node</th><th>Status</th><th>Last report (EAT)</th>
                ${coreKeys.map(k => `<th>${columnLabels[k]}<span class="column-unit">${escapeHtml(getUnit(k))}</span></th>`).join('')}
                <th>Location</th><th>Details</th>`;
            tableBody.innerHTML = readings.map(r => {
                const metrics = r.metrics || {};
                const extraKeys = Object.keys(metrics).filter(k => !coreKeys.includes(k) && typeof metrics[k] === 'number' && Number.isFinite(metrics[k]));
                const location = r.location;
                const coordinates = location && location.latitude != null && location.longitude != null
                    ? `${location.latitude}, ${location.longitude}` : '--';
                const details = extraKeys.length ? `<details data-node="${escapeHtml(r.device_id)}" ${expandedNodes.has(r.device_id) ? 'open' : ''}>
                    <summary>Details</summary>
                    <dl style="min-width: 180px; margin: 12px 0">${extraKeys.map(k => `<dt style="color: var(--text-secondary)">${escapeHtml(k === 'predicted_pm25' ? 'Predicted PM2.5' : formatLabel(k))}</dt><dd style="margin: 4px 0 12px">${escapeHtml(metrics[k])} ${escapeHtml(k === 'predicted_pm25' ? 'µg/m³' : getUnit(k))}</dd>`).join('')}</dl>
                    </details>` : '--';
                return `<tr>
                    <td class="cell-device">${escapeHtml(r.device_id)}</td>
                    <td><span class="status-tag" style="color: ${r.status === 'online' ? 'var(--success)' : 'var(--text-muted)'}; background: ${r.status === 'online' ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.05)'}">● ${r.status === 'online' ? 'Online' : 'Offline'}</span></td>
                    <td>${escapeHtml(r.timestamp)}<div style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px">${Number.isFinite(r.last_seen_seconds) ? (r.last_seen_seconds < 60 ? `${r.last_seen_seconds}s ago` : `${Math.floor(r.last_seen_seconds / 60)}m ago`) : '--'}</div></td>
                    ${coreKeys.map(k => `<td class="cell-value">${typeof metrics[k] === 'number' && Number.isFinite(metrics[k]) ? escapeHtml(metrics[k]) : '--'}</td>`).join('')}
                    <td>${escapeHtml(coordinates)}</td><td class="details-cell">${details}</td>
                </tr>`;
            }).join('');
        }

        // Initial setup
        loadDevices();
        fetchLatestData();
        setInterval(() => { loadDevices(); fetchLatestData(); }, 5000);
    </script>

</body>

</html>
