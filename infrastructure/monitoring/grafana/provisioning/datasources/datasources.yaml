apiVersion: 1
datasources:
  - name: InfluxDB
    uid: aqmrg-influxdb
    type: influxdb
    access: proxy
    isDefault: true
    # Don't crash Grafana startup if InfluxDB token/bucket isn't ready yet
    ignoreNotFound: true
    url: ${INFLUXDB_URL:-http://influxdb:8086}
    jsonData:
      version: Flux
      organization: aqmrg
      defaultBucket: sensor_data
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
